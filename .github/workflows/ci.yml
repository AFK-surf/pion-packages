name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned AFK-surf/pion compiler revision used to build and test every package.
  PION_REV: 56d114a36012e822fbda8938ddcf998f3eca5211

jobs:
  ci:
    name: fmt, check, test and wasm32 (all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record job start
        run: |
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "PION_OUT=$RUNNER_TEMP/pion-out" >> "$GITHUB_ENV"
          echo "PION_CACHE_DIR=$RUNNER_TEMP/pion-cas" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore pionc toolchain
        id: toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-out
          key: pionc-${{ runner.os }}-${{ runner.arch }}-${{ env.PION_REV }}-v1

      - name: Check out AFK-surf/pion
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AFK-surf/pion
          ref: ${{ env.PION_REV }}
          path: .pion
          persist-credentials: false

      - name: Bootstrap pionc (seed -> Stage 1)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          set -eu
          P="$GITHUB_WORKSPACE/.pion"
          O="$P/out"
          W="$RUNNER_TEMP/pion-boot"
          mkdir -p "$O" "$W"
          export CC=cc
          sh "$P/scripts/build-qbe.sh" "$O/qbe"
          F="-std=c11 -O2 -fPIC -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident"
          cc $F -c "$P/runtime/pion_rt.c" -o "$W/pion_rt.o"
          cc $F -c "$P/runtime/pion_cli.c" -o "$W/pion_cli.o"
          strip --strip-unneeded "$W/pion_rt.o"
          ar rcs "$O/libpionrt.a" "$W/pion_rt.o"
          ar rcs "$W/libpionrt_cli.a" "$W/pion_rt.o" "$W/pion_cli.o"
          gzip -dc "$P/bootstrap/pionc-seed.ssa.gz" > "$W/seed.ssa"
          "$O/qbe" -t amd64_sysv --obj -o "$W/pionc0.o" "$W/seed.ssa"
          cc "$W/pionc0.o" "$W/libpionrt_cli.a" -lm -lpthread -o "$W/pionc0"
          export PION_QBE="$O/qbe" PION_RT_LIB="$W/libpionrt_cli.a"
          cd "$P"
          PION_CACHE_DIR="$W/cas1" "$W/pionc0" build -o "$O/pionc1" compiler/src/core compiler/src/cli/main.pion
          mkdir -p "$PION_OUT"
          cp "$O/pionc1" "$O/qbe" "$O/libpionrt.a" "$PION_OUT/"
          cd "$GITHUB_WORKSPACE"
          rm -rf "$P" "$W"

      - name: Set up pionc
        run: |
          echo "PIONC=$PION_OUT/pionc1" >> "$GITHUB_ENV"
          echo "PION_QBE=$PION_OUT/qbe" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$PION_OUT/libpionrt.a" >> "$GITHUB_ENV"
          "$PION_OUT/pionc1" --version

      - name: Restore Pion CAS
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-${{ runner.os }}-${{ runner.arch }}-${{ env.PION_REV }}-${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'packages/**/*.pion') }}
          restore-keys: |
            pion-cas-${{ runner.os }}-${{ runner.arch }}-${{ env.PION_REV }}-

      - name: pionc fmt --check
        run: '"$PIONC" fmt --check .'

      - name: pionc check
        run: |
          "$PIONC" check --json . > "$RUNNER_TEMP/check.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("check ok=%s diagnostics=%d" % (d["ok"], len(d["diagnostics"]))); sys.exit(0 if d["ok"] and not d["diagnostics"] else 1)' "$RUNNER_TEMP/check.json" || { cat "$RUNNER_TEMP/check.json"; exit 1; }

      - name: pionc test
        run: |
          rc=0
          "$PIONC" test --only-pkg --jobs 4 --json . > "$RUNNER_TEMP/test.json" || rc=$?
          python3 - "$RUNNER_TEMP/test.json" "$rc" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          tests = d.get("tests", [])
          for t in tests:
              if t.get("ok") is not True:
                  print("::error title=test failed::%s: %s" % (t.get("pkg"), t.get("name")))
          pkgs = len(d.get("packages", []))
          print("packages=%d total=%d passed=%d failed=%d deps_skipped=%d tests=%d rc=%s" % (
              pkgs, d["total"], d["passed"], d["failed"], d["deps_skipped"], len(tests), sys.argv[2]
          ))
          ok = (
              d.get("ok") is True
              and d.get("failed") == 0
              and d.get("deps_skipped") == 0
              and pkgs >= 101
              and d.get("total", 0) >= 5767
              and d.get("passed") == d.get("total") == len(tests)
              and all(t.get("ok") is True for t in tests)
              and sys.argv[2] == "0"
          )
          sys.exit(0 if ok else 1)
          EOF

      - name: wasm32 smoke builds
        run: |
          W="$RUNNER_TEMP/wasm"
          mkdir -p "$W"
          ls -d packages/*/wasm_smoke | xargs -P 4 -I{} sh -c '
            n=$(basename "$(dirname "$1")")
            "$PIONC" build --target wasm32 -o "$2/$n.wasm" "$1" > "$2/$n.log" 2>&1 || { echo "::error title=wasm32 build failed::$n"; cat "$2/$n.log"; exit 255; }
          ' _ {} "$W"
          n=$(ls "$W"/*.wasm | wc -l)
          echo "wasm32 smoke builds: $n"
          [ "$n" -ge 101 ]

      - name: Clean worktree
        run: |
          DIRTY=$(git status --porcelain --ignored)
          if [ -n "$DIRTY" ]; then
            echo "worktree is not clean:"
            printf '%s\n' "$DIRTY"
            exit 1
          fi

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job ci duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::ci took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi
