[package]
name = "rt_handlebars_oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
handlebars = "=6.4.4"
# preserve_order: iterate objects in insertion order (as Handlebars.js and the Pion engine do), so that
# `{{#each obj}}` differences are semantic and not serde_json's default BTreeMap key sorting.
serde_json = { version = "=1.0.145", features = ["preserve_order"] }

[profile.release]
opt-level = 3
