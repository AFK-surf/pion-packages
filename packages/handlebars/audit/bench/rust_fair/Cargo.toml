[package]
name = "handlebars_rust_fair"
version = "0.1.0"
edition = "2021"
publish = false

# Same crate versions and profile as packages/handlebars/bench/rust_bench (handlebars 6.4.4,
# serde_json default features), so differences come only from how the API is used.
[dependencies]
handlebars = "=6.4.4"
serde_json = "=1.0.145"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
