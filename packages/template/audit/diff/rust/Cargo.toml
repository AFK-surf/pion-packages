[package]
name = "template-audit-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diff_rust"
path = "src/main.rs"

[dependencies]
# Locked upstream reference; `urlencode` + `loop_controls` widen the built-in surface we
# can differentially test, `fuel` lets us compare DoS budgets.
minijinja = { version = "=3.1.0", features = ["builtins", "json", "preserve_order", "urlencode", "loop_controls", "fuel"] }
indexmap = "2.2"

[profile.release]
opt-level = 3
