[package]
name = "jsonpath_audit_oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Reference oracle for the packages/jsonpath red-team audit.
# Versions are pinned exactly and resolved through the committed Cargo.lock (`cargo build --locked`).
[dependencies]
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
serde_json_path = "=0.7.2"
json-patch = "=4.2.0"
jsonptr = "=0.7.1"

