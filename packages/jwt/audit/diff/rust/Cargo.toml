[package]
name = "jwt-audit-rust"
version = "0.1.0"
edition = "2021"

# Same crate versions jsonwebtoken 12.0.0 itself resolves to (see bench/rust Cargo.lock).
[dependencies]
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
hmac = "=0.13.0"
base64 = "=0.23.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "oracle_rust"
path = "src/main.rs"
