[package]
name = "opentype_audit_oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Independent authorities for packages/opentype/audit (exact pins, Cargo.lock committed, built --locked):
#   ttf-parser 0.25.1 (the reference the package claims parity with)
#   skrifa 0.44.0 / read-fonts 0.41.0 (Google fontations, FreeType-compatible, used by Chrome)
[dependencies]
ttf-parser = "=0.25.1"
skrifa = "=0.44.0"

[workspace]

[profile.release]
opt-level = 3
