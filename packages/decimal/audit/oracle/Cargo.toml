[package]
name = "decimal_audit_oracle"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_decimal = { version = "=1.37.2", features = ["maths"] }

[[bin]]
name = "rust_oracle"
path = "src/main.rs"

[[bin]]
name = "rust_advbench"
path = "src/advbench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
