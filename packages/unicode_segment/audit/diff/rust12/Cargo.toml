# Same oracle source as ../rust, pinned to unicode-segmentation 1.12.0 (the last Unicode 16.0.0 release):
# 1.13.x ships Unicode 17.0.0 tables, so this build separates Unicode-version drift from real defects.
[package]
name = "useg_oracle12"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "useg_oracle12"
path = "../rust/src/main.rs"

[dependencies]
unicode-segmentation = "=1.12.0"

[profile.release]
opt-level = 3
