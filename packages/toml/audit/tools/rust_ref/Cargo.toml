[package]
name = "toml_audit_rust_ref"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (not part of any workspace).
[workspace]

[[bin]]
name = "rust_ref"
path = "src/main.rs"

[dependencies]
# Latest upstream (TOML 1.1.0 spec) -- what a Rust user gets today with `cargo add toml`.
toml = "=1.2.2"
# The version packages/toml/bench/rust_bench pins (old toml_edit-based parser).
toml08 = { package = "toml", version = "=0.8.23" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
