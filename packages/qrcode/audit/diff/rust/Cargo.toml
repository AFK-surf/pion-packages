[package]
name = "qrcode-audit-rust"
version = "0.1.0"
edition = "2021"

# Reference implementations for RT-qrcode (all --release):
#   qrcodegen 1.8.0 (Nayuki, the de-facto ISO/IEC 18004 reference encoder)
#   rqrr 0.11.0     (Rust port of quirc: independent matrix decoder, handles mirror images)
#   qrcode 0.14.1   (kennytm; the W12 benchmark baseline)
#   fast_qr 0.14.0  (modern optimised encoder, fairness check)
[dependencies]
qrcodegen = "=1.8.0"
rqrr = { version = "=0.11.0", default-features = false }
qrcode = { version = "=0.14.1", default-features = false }
fast_qr = { version = "=0.14.0", default-features = false }

[[bin]]
name = "oracle_rust"
path = "src/main.rs"

[profile.release]
opt-level = 3
