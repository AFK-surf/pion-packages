[package]
name = "hyph_oracle"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
hyphenation = { version = "=0.8.4", features = ["embed_en-us"] }
hyphenation_commons = "=0.8.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
