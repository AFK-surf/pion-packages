[package]
name = "jsonschema-audit-oracle"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned reference implementation. default-features off: no HTTP / file retrieval, offline-only like Pion v0.1.0.
jsonschema = { version = "=0.29.1", default-features = false }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
serde = "1"
