[package]
name = "uuid_audit_oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Exact upstream versions under audit (red-team reference oracle).
[dependencies]
uuid = { version = "=1.29.3", features = ["v1", "v3", "v5", "v6", "v7", "v8"] }
ulid = { version = "=1.2.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

