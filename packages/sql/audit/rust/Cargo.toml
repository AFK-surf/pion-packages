[package]
name = "sql_audit_oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sqlparser = "=0.53.0"
mimalloc = { version = "=0.1.52", optional = true, default-features = false }

[features]
# Fairness probe: the same oracle with mimalloc instead of the macOS system allocator.
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
