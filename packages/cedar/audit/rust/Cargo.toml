[package]
name = "cedar_rt_audit"
version = "0.1.0"
edition = "2021"
publish = false

# Red-team oracle for packages/cedar: official Rust `cedar-policy` pinned EXACTLY at 4.15.0
# (default features: ipaddr + decimal + datetime). Always build with `--locked`.
#   src/bin/oracle.rs      differential transcript oracle (same case format as diff/pion_driver)
#   src/bin/dos.rs         DoS probe twin of dos/pion_dos
#   src/bin/bench_fair.rs  W2/W3 with request construction hoisted out of the timed loop
[dependencies]
cedar-policy = { version = "=4.15.0" }
serde_json = "1"

[profile.release]
opt-level = 3
