[package]
name = "oracle_rust"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (not part of any cargo workspace); build with CARGO_TARGET_DIR outside the repo.
[workspace]

[dependencies]
x509-parser = "=0.16.0"
der = { version = "=0.7.10", features = ["oid", "alloc", "std"] }
spki = { version = "0.7", features = ["alloc"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
pem = "=3.0.6"
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
rustls-pki-types = "1"

[profile.release]
opt-level = 3
