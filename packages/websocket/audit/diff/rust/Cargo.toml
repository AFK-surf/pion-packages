[package]
name = "ws-redteam-diff-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diff_rust"
path = "src/diff.rs"

[[bin]]
name = "adv_rust"
path = "src/adv.rs"

[[bin]]
name = "hs_rust"
path = "src/hs.rs"

[dependencies]
tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
