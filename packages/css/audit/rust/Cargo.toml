[package]
name = "css_oracle"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
cssparser = "=0.35.0"
cssparser-color = "=0.3.0"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }

[profile.release]
opt-level = 3
lto = true
debug = false
