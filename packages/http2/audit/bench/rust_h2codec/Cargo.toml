[package]
name = "h2-codec-bench"
version = "0.1.0"
edition = "2021"
publish = false

# h2 0.4.20's own frame engine (`h2::Codec`, exposed by the `unstable` feature): frame parsing,
# CONTINUATION reassembly, HPACK decode and header-field validation; no stream state machine
# (same level as Go's Framer + ReadMetaHeaders and Pion decode_frame + HpackDecoder).
[dependencies]
h2 = { version = "=0.4.20", features = ["unstable"] }
tokio = { version = "1", default-features = false }
bytes = "1"
futures-core = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
