[package]
name = "h2-hpack-diff"
version = "0.1.0"
edition = "2021"
publish = false

# The HPACK engine is h2 0.4.20's own `src/hpack` module (crate-private upstream), copied verbatim
# from the local cargo registry by vendor_h2_hpack.sh into the *build copy* of this project
# (under $AUDIT_OUT, never into git). Only `impl From<DecoderError> for frame::Error` is dropped.
[dependencies]
bytes = "1"
http = "1"
tracing = { version = "0.1", default-features = false }
fnv = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
